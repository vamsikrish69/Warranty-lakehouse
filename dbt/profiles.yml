warranty_lakehouse:
  target: dev
  outputs:
    dev:
      type: databricks
      catalog: workspace
      schema: warranty_dbt
      host: "{{ env_var('DATABRICKS_HOST').replace('https://', '').split('/')[0] }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 2
