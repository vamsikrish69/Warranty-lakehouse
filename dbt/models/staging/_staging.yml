version: 2

models:
  - name: stg_customers
    description: One row per customer (latest version), parsed from bronze JSON.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: region
        data_tests:
          - accepted_values:
              arguments:
                values: ['North America', 'United Kingdom', 'India']

  - name: stg_product_assets
    description: One row per product asset (latest version), parsed from bronze JSON. Future purchase dates are flagged, not removed.
    columns:
      - name: asset_id
        data_tests:
          - unique
          - not_null
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
              config:
                severity: warn
      - name: asset_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE']

  - name: stg_warranty_entitlements
    description: One row per warranty entitlement (latest version). Raw entitlement_status is kept as-is (it goes stale); invalid coverage ranges are flagged, not removed.
    columns:
      - name: entitlement_id
        data_tests:
          - unique
          - not_null
      - name: asset_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_product_assets')
                field: asset_id
              config:
                severity: warn
      - name: warranty_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['MAIL_IN', 'ONSITE']
  
  - name: stg_customer_contacts
    description: One row per customer contact (latest version). Invalid channels are flagged, not removed. warranty_status_at_contact is the raw claimed status; the date-derived status lives in int_warranty_validation.
    columns:
      - name: contact_id
        data_tests:
          - unique
          - not_null
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['VOICE_SUPPORT', 'CHAT_SUPPORT', 'FACEBOOK_SUPPORT', 'SOCIAL_MEDIA_SUPPORT']
              config:
                severity: warn
      - name: asset_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_product_assets')
                field: asset_id
              config:
                severity: warn
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
              config:
                severity: warn
      - name: warranty_status_at_contact
        data_tests:
          - accepted_values:
              arguments:
                values: ['IN_WARRANTY', 'OUT_OF_WARRANTY']                